<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        *{ /* Configações globais das CSS*/
            height: 100%;
        }

        body{
            background-image: linear-gradient(to bottom, #595594, #363377, #0B083B);
            background-attachment: fixed;
        }
    </style>
</head>
<body>
    <h1>Testante gradiente</h1>
</body>
</html>
