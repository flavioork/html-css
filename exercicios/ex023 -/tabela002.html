<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        th,
        tfoot {
            border: 1px solid black;
            background-color: rgba(128, 128, 128, 0.863);
            color: white;
        }

        td {
            border: 1px solid black;
            text-align: center;
        }

        .numero {
            text-align: right;
        }
    </style>
</head>

<body>
    <h1>Uso de tabelas grandes</h1>
    <!--
        ANATOMIA PARA TABELAS GRANDES
        TABLE
            THEAD
                TR, TD, TH
            TBODY
                TR, TD, TH
            TFOOT
                TR, TD, TH
    -->

    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>População</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Pernambuco</td>
                <td class="numero">1.000.000</td>
            </tr>
            <tr>
                <td>São Paulo</td>
                <td class="numero">100.000</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="numero">10.000</td>
            </tr>
            <tr>
                <td>Piauí</td>
                <td class="numero">1.000</td>
            </tr>
            <tr>
                <td>Paraíba</td>
                <td class="numero">100</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="numero">10</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="numero">1</td>
            </tr>
        </tbody>

        <tfoot>
            <th>Total</th>
            <td class="numero">1.111.111</td>
        </tfoot>
    </table>

</body>

</html>
