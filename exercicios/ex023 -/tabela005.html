<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;

            width: 450px;
        }

        caption {
            background-color: lightgray;
            padding: 10px;
            font-weight: bold;
            font-size: 1.3em;
        }

        th {
            border: 1px solid black;
            padding: 10px;
        }

        td {
            border: 1px solid black;
            padding: 10px;

        }

        col.amarelo {
            background-color: yellow;
        }

        col.azul {
            background-color: lightblue;
        }
    </style>
</head>

<body>
    <h1>Exercício de Tabelas</h1>
    <table>
        <colgroup>
            <col class="amarelo">
            <col class="azul" span="2">
            <col class="amarelo">
        </colgroup>
        <caption>
            Cadastro
        </caption>
        <tr>
            <th>Nome</th>
            <th>Sexo</th>
            <th>Idade</th>
            <th>Profissão</th>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Medica</td>
        </tr>
        <tr>
            <td>João</td>
            <td>M</td>
            <td>22</td>
            <td>Fisioterapeuta</td>
        </tr>
        <tr>
            <td>Juliana</td>
            <td>F</td>
            <td>21</td>
            <td>Atendente</td>
        </tr>
        <tr>
            <td>José</td>
            <td>M</td>
            <td>45</td>
            <td>CEO</td>
        </tr>
    </table>
</body>

</html>
